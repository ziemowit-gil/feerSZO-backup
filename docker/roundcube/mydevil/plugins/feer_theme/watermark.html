<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title></title>
<!-- feer_theme: zamiast skins/elastic/watermark.html (dowiązanie w app/, zob. README).
     Pusty podgląd wiadomości: wyblakłe logo FEER zamiast logo Roundcube. -->
<style>
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #f8fafc; display: flex; align-items: center; justify-content: center; }
img { width: 34%; max-width: 280px; min-width: 140px; opacity: .14; filter: grayscale(1); }
html.dark-mode body { background: #0f172a; }
html.dark-mode img { filter: grayscale(1) invert(1); opacity: .12; }
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
</script>
</head>
<body><img src="../../plugins/feer_theme/logo.png" alt=""></body>
</html>
