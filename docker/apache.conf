# Obsługa nagłówków Traefik (X-Forwarded-For, X-Forwarded-Proto)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 10.0.0.0/8

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Wrażliwe pliki — zablokowane
    <FilesMatch "\.(sql|db|db-shm|db-wal|log|env|md|sh|example)$">
        Require all denied
    </FilesMatch>

    # Blokada katalogów systemowych
    <DirectoryMatch "^/var/www/html/(docker|cli|bin|cron|vendor|tenants)/">
        Require all denied
    </DirectoryMatch>

    # Nagłówki bezpieczeństwa (uzupełniane przez Traefik w prod)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog  /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
