; ── PHP — konfiguracja PRODUKCYJNA ───────────────────────────────────────────
; Używana przez docker-compose.prod.yml (nadpisuje php.ini)
; Nie modyfikuj php.ini bezpośrednio dla produkcji.

; ── Błędy — nie pokazuj użytkownikom ─────────────────────────────────────────
display_errors         = Off
display_startup_errors = Off
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors             = On
error_log              = /var/log/apache2/php_errors.log
expose_php             = Off

; ── Limity ────────────────────────────────────────────────────────────────────
memory_limit        = 256M
upload_max_filesize = 50M
post_max_size       = 52M
max_execution_time  = 60
max_input_vars      = 3000

; ── Strefa czasowa ────────────────────────────────────────────────────────────
date.timezone = Europe/Warsaw

; ── SQLite ────────────────────────────────────────────────────────────────────
sqlite3.defensive = 1

; ── Opcache (produkcja — agresywne cache, brak sprawdzania plików) ────────────
opcache.enable                 = 1
opcache.validate_timestamps    = 0
opcache.revalidate_freq        = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 10000
opcache.fast_shutdown          = 1
opcache.enable_cli             = 0

; ── Sesje → Redis ─────────────────────────────────────────────────────────────
session.save_handler   = redis
session.save_path      = "tcp://redis:6379?prefix=feer:"
session.gc_maxlifetime = 86400
session.cookie_secure   = On
session.cookie_httponly = On
session.cookie_samesite = Lax

; ── Mail (produkcja: Graph API; fallback msmtp) ───────────────────────────────
sendmail_path = /usr/bin/msmtp -t
