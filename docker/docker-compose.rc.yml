# ── Roundcube ("rc") addon — webmail dla userów, logowanie OAuth2 do M365 ─────
#
# DEV:
#   docker compose -f docker-compose.yml -f docker-compose.rc.yml up -d
#
# PROD:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.rc.yml --env-file .env.prod up -d
#
# Przed uruchomieniem ustaw w .env / .env.prod (zob. sekcja "Roundcube" w
# .env.prod.example) oraz wykonaj kroki manualne opisane w docker/roundcube/README.md
# (rejestracja aplikacji Azure AD, rekord DNS rc.feer.org.pl).
#
# Roundcube trzyma własną (małą) bazę w SQLite — trwały wolumin rc_db.
# Skrzynki użytkowników to Microsoft 365 (IMAP/SMTP outlook.office365.com /
# smtp.office365.com), logowanie przez OAuth2 — hasła do skrzynek NIE są
# przechowywane w Roundcube. Konfiguracja: ./roundcube/config.inc.php.
# Plugin OneDrive ("dołącz z OneDrive" w oknie tworzenia maila): zob.
# ./roundcube/plugins/onedrive_picker/ — reużywa tokenu OAuth z logowania.
# Plugin ownCloud (analogiczny, ale konto integracyjne WebDAV, nie per-user):
# zob. ./roundcube/plugins/owncloud_picker/ — RC_OWNCLOUD_* poniżej.
# Plugin outlook_contacts_sync — jednostronna synchronizacja kontaktów Outlooka
# do lokalnego adresownika Roundcube przy logowaniu, zob.
# ./roundcube/plugins/outlook_contacts_sync/.
# Plugin feer_theme — warstwa wizualna (nakładka CSS na skin Elastic) w barwach
# modułu Poczta głównej aplikacji, zob. ./roundcube/plugins/feer_theme/.

services:

  rc:
    image: roundcube/roundcubemail:latest   # przypiąć konkretny tag przed produkcją
    container_name: feer-rc
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE:   sqlite
      # Skin: WYŁĄCZNIE wbudowany "elastic" (jedyny aktywnie utrzymywany skin
      # Roundcube — responsywny, z trybem ciemnym). Wygląd FEER dokłada plugin
      # feer_theme (nakładka CSS), zob. ./roundcube/plugins/feer_theme/.
      # NIE wracać do skinów rodziny Larry (larry/classic/chameleon-*): zostały
      # usunięte z rdzenia w Roundcube 1.6 i skin dziedziczący po "larry" wywala
      # webmaila błędem na każdym żądaniu. Lista dozwolonych skinów jest też
      # zablokowana w config.inc.php ($config['skins_allowed']).
      ROUNDCUBEMAIL_SKIN:      elastic
      RC_DOMAIN:               ${RC_DOMAIN:-localhost}
      RC_TENANT_ID:            ${RC_TENANT_ID:-}
      RC_OAUTH_CLIENT_ID:      ${RC_OAUTH_CLIENT_ID:-}
      RC_OAUTH_CLIENT_SECRET:  ${RC_OAUTH_CLIENT_SECRET:-}
      RC_IMAP_HOST:            ${RC_IMAP_HOST:-ssl://outlook.office365.com:993}
      RC_SMTP_HOST:            ${RC_SMTP_HOST:-tls://smtp.office365.com:587}
      RC_OWNCLOUD_URL:         ${RC_OWNCLOUD_URL:-}
      RC_OWNCLOUD_USERNAME:    ${RC_OWNCLOUD_USERNAME:-}
      RC_OWNCLOUD_PASSWORD:    ${RC_OWNCLOUD_PASSWORD:-}
      RC_OWNCLOUD_BASE_FOLDER: ${RC_OWNCLOUD_BASE_FOLDER:-poczta-udostepnione}
      # Ten sam sekret co kontener "app" (docker-compose.yml) — plugin login_notice
      # używa go jako nagłówka X-Internal-Key przy odpytywaniu wewnętrznego API
      # (http://app/api/internal/rc_login_notice.php) po sieci Docker "feer",
      # bez przechodzenia przez Traefik.
      APP_KEY: ${APP_KEY:-}
    volumes:
      - rc_db:/var/roundcube/db
      - ./roundcube/config.inc.php:/var/roundcube/config/config.inc.php:ro
      - ./roundcube/plugins/onedrive_picker:/var/www/html/plugins/onedrive_picker:ro
      - ./roundcube/plugins/owncloud_picker:/var/www/html/plugins/owncloud_picker:ro
      - ./roundcube/plugins/outlook_contacts_sync:/var/www/html/plugins/outlook_contacts_sync:ro
      - ./roundcube/plugins/login_notice:/var/www/html/plugins/login_notice:ro
      - ./roundcube/plugins/feer_theme:/var/www/html/plugins/feer_theme:ro
    labels:
      # Bez efektu w dev (Traefik nie działa) — aktywne dopiero z docker-compose.prod.yml.
      - "traefik.enable=true"
      - "traefik.http.routers.rc.rule=Host(`${RC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.rc.entrypoints=websecure"
      - "traefik.http.routers.rc.tls=true"
      - "traefik.http.routers.rc.tls.certresolver=le"
      - "traefik.http.routers.rc.middlewares=sec-headers@docker"
      - "traefik.http.services.rc.loadbalancer.server.port=80"
      - "traefik.http.routers.rc-http.rule=Host(`${RC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.rc-http.entrypoints=web"
      - "traefik.http.routers.rc-http.middlewares=https-redirect@docker"
    networks:
      - feer

volumes:
  rc_db:
