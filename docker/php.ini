; ── Ogólne ────────────────────────────────────────────────────────────────────
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/apache2/php_errors.log

; ── Limity ────────────────────────────────────────────────────────────────────
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 52M
max_execution_time = 120
max_input_vars = 3000

; ── Strefa czasowa ────────────────────────────────────────────────────────────
date.timezone = Europe/Warsaw

; ── SQLite ────────────────────────────────────────────────────────────────────
sqlite3.defensive = 0

; ── Opcache (dev — krótkie TTL) ───────────────────────────────────────────────
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000

; ── Sesje → Redis ─────────────────────────────────────────────────────────────
; ext-redis obsługuje ten handler natywnie (PECL redis).
; Prefix "feer:" izoluje sesje aplikacji od innych kluczy w Redis.
session.save_handler = redis
session.save_path    = "tcp://redis:6379?prefix=feer:"
session.gc_maxlifetime = 86400

; ── Mail (msmtp jako sendmail_path) ───────────────────────────────────────────
sendmail_path = /usr/bin/msmtp -t
