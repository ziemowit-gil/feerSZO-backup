# ── EJBCA CE — wewnętrzny urząd certyfikacji (CA) ─────────────────────────────
#
# Dwa wejścia pod tą samą domeną (CA_DOMAIN):
#   https://${CA_DOMAIN}/                       — Public Web / RA / OCSP / CRL
#                                                  (Traefik terminuje TLS, cert Let's Encrypt)
#   https://${CA_DOMAIN}:8443/ejbca/adminweb/   — panel administracyjny
#                                                  (TLS passthrough — Traefik NIE terminuje TLS,
#                                                  EJBCA sam wymusza certyfikat kliencki)
#
# Dlaczego dwa wejścia: AdminWeb wymaga uwierzytelnienia certyfikatem klienckim
# na poziomie handshake'u TLS. Gdyby Traefik terminował TLS (jak dla reszty apki),
# EJBCA nigdy nie zobaczyłby certyfikatu klienta. Dlatego port 8443 idzie przez
# osobny entrypoint Traefika w trybie passthrough (zob. docker-compose.prod.yml).
#
# Wymaga:
#   - docker-compose.prod.yml z entrypointem `ejbca-admin` (port 8443) — już dodany
#   - DNS: CA_DOMAIN → IP serwera
#   - Port 8443 otwarty w firewallu (obok 80/443)
#   - Zmienne w .env.prod — zob. .env.prod.example, sekcja EJBCA
#
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.ejbca.yml --env-file .env.prod up -d
#
# Pierwsze uruchomienie i dalsza obsługa: zob. docker/EJBCA.md
#
# WAŻNE: EJBCA Community Edition to wersja społecznościowa — producent (Keyfactor)
# zastrzega, że nie jest wspierana/rekomendowana do produkcji bez umowy supportowej.
# Traktuj to jako świadomą decyzję; rób regularne backupy wolumenu ejbca_data
# oraz bazy ejbca_db_data (tam żyje klucz prywatny CA).

services:

  ejbca-db:
    image: mariadb:11
    container_name: feer-ejbca-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${EJBCA_DB_ROOT_PASSWORD:?Ustaw EJBCA_DB_ROOT_PASSWORD w .env.prod}
      MARIADB_DATABASE:      ejbca
      MARIADB_USER:          ejbca
      MARIADB_PASSWORD:      ${EJBCA_DB_PASSWORD:?Ustaw EJBCA_DB_PASSWORD w .env.prod}
    volumes:
      - ejbca_db_data:/var/lib/mysql
    healthcheck:
      test: >
        mariadb-admin ping -h localhost
        -u root -p$$MARIADB_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - feer

  ejbca:
    image: keyfactor/ejbca-ce:latest
    container_name: feer-ejbca
    hostname: ${CA_DOMAIN:?Ustaw CA_DOMAIN w .env.prod}
    restart: unless-stopped
    depends_on:
      ejbca-db:
        condition: service_healthy
    environment:
      TLS_SETUP_ENABLED:       "true"
      PASSWORD_ENCRYPTION_KEY: ${EJBCA_PASSWORD_ENCRYPTION_KEY:?Ustaw EJBCA_PASSWORD_ENCRYPTION_KEY w .env.prod}
      CA_KEYSTOREPASS:         ${EJBCA_CA_KEYSTOREPASS:?Ustaw EJBCA_CA_KEYSTOREPASS w .env.prod}
      DATABASE_JDBC_URL:       jdbc:mariadb://ejbca-db:3306/ejbca?characterEncoding=UTF-8
      DATABASE_USER:           ejbca
      DATABASE_PASSWORD:       ${EJBCA_DB_PASSWORD}
    volumes:
      - ejbca_data:/mnt/persistent
    labels:
      - "traefik.enable=true"

      # ── Public Web / RA / OCSP / CRL — HTTPS terminowany przez Traefik ────────
      - "traefik.http.routers.ejbca.rule=Host(`${CA_DOMAIN}`)"
      - "traefik.http.routers.ejbca.entrypoints=websecure"
      - "traefik.http.routers.ejbca.tls=true"
      - "traefik.http.routers.ejbca.tls.certresolver=le"
      - "traefik.http.routers.ejbca.middlewares=sec-headers@docker"
      - "traefik.http.services.ejbca.loadbalancer.server.port=8080"

      - "traefik.http.routers.ejbca-http.rule=Host(`${CA_DOMAIN}`)"
      - "traefik.http.routers.ejbca-http.entrypoints=web"
      - "traefik.http.routers.ejbca-http.middlewares=https-redirect@docker"

      # ── AdminWeb — TLS passthrough (EJBCA sam obsługuje TLS + cert klienta) ───
      - "traefik.tcp.routers.ejbca-admin.rule=HostSNI(`${CA_DOMAIN}`)"
      - "traefik.tcp.routers.ejbca-admin.entrypoints=ejbca-admin"
      - "traefik.tcp.routers.ejbca-admin.tls.passthrough=true"
      - "traefik.tcp.services.ejbca-admin.loadbalancer.server.port=8443"
    networks:
      - feer

volumes:
  ejbca_db_data:
  ejbca_data:
