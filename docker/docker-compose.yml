# ── FEER SZO — bazowy stack ───────────────────────────────────────────────────
# Ten plik definiuje wspólne usługi dla dev i prod.
#
# Dev  (domyślnie, auto-ładuje override.yml):
#   docker compose up -d
#
# Prod (wymaga pliku .env.prod):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Prod + MySQL:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.mysql.yml --env-file .env.prod up -d

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: feer-szo-app:latest
    container_name: feer-app
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    environment:
      APP_ENV:        ${APP_ENV:-development}
      APP_KEY:        ${APP_KEY:-}
      APP_URL:        ${APP_URL:-http://localhost}
      ORG_NAME:       ${ORG_NAME:-FEER SZO}
      # Baza danych
      DB_TYPE:        ${DB_TYPE:-sqlite}
      DB_HOST:        ${DB_HOST:-mysql}
      DB_PORT:        ${DB_PORT:-3306}
      DB_NAME:        ${DB_NAME:-feer}
      DB_USER:        ${DB_USER:-feer}
      DB_PASS:        ${DB_PASS:-}
      # Microsoft 365
      MS_ENABLED:     ${MS_ENABLED:-0}
      MS_TENANT_ID:   ${MS_TENANT_ID:-}
      MS_CLIENT_ID:   ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_REDIRECT_URI:  ${MS_REDIRECT_URI:-}
      # SMTP (fallback dla mail(); w produkcji wypełnij lub używaj Graph API)
      SMTP_HOST:  ${SMTP_HOST:-mailpit}
      SMTP_PORT:  ${SMTP_PORT:-1025}
      SMTP_FROM:  ${SMTP_FROM:-no-reply@feer.local}
      SMTP_USER:  ${SMTP_USER:-}
      SMTP_PASS:  ${SMTP_PASS:-}
      SMTP_TLS:   ${SMTP_TLS:-off}
      # Silnik egzaminów TI (moduł Testy wiedzy i umiejętności)
      EXAM_ENGINE_URL:   ${EXAM_ENGINE_URL:-http://exam-engine:8090}
      EXAM_ENGINE_TOKEN: ${EXAM_ENGINE_TOKEN:-}
      # Warstwa hybrydowa SZO/TI/Dydaktyka (hybrid/) — local: wszystko w tym
      # procesie (domyślne, gdy zmienne nie ustawione); http: dana domena
      # jest osobnym serwisem. Patrz hybrid/README.md.
      SZO_DRIVER:              ${SZO_DRIVER:-local}
      SZO_API_BASE_URL:        ${SZO_API_BASE_URL:-}
      SZO_API_KEY:             ${SZO_API_KEY:-}
      TI_DRIVER:               ${TI_DRIVER:-local}
      TI_API_BASE_URL:         ${TI_API_BASE_URL:-}
      TI_API_KEY:              ${TI_API_KEY:-}
      DYDAKTYKA_DRIVER:        ${DYDAKTYKA_DRIVER:-local}
      DYDAKTYKA_API_BASE_URL:  ${DYDAKTYKA_API_BASE_URL:-}
      DYDAKTYKA_API_KEY:       ${DYDAKTYKA_API_KEY:-}
    networks:
      - feer
      - exam

  # ── Strona błędu — zawsze żywa, serwuje error.html przy 502/503 ─────────
  error-pages:
    image: nginx:alpine
    container_name: feer-error-pages
    restart: unless-stopped
    volumes:
      - ./error-pages:/usr/share/nginx/html:ro
    networks:
      - feer

  # ── SZO Planner — Angular SPA (nginx) ────────────────────────────────────
  szo-planner:
    build:
      context: ../plannerNew
      dockerfile: Dockerfile
    image: feer-szo-planner:latest
    container_name: feer-szo-planner
    restart: unless-stopped
    networks:
      - feer

  # ── Silnik egzaminów TI — Java (generowanie testów, ocenianie, piaskownica) ─
  #
  # Usługa stoi WYŁĄCZNIE w sieci `exam`, która jest wewnętrzna (internal: true).
  # Dzięki temu kod uruchamiany w piaskownicy nie ma żadnego wyjścia na świat,
  # a jedynym rozmówcą silnika jest kontener aplikacji.
  exam-engine:
    build:
      context: ../exam-engine
      dockerfile: Dockerfile
    image: feer-exam-engine:latest
    container_name: feer-exam-engine
    restart: unless-stopped
    environment:
      EXAM_PORT:           "8090"
      EXAM_ENGINE_TOKEN:   ${EXAM_ENGINE_TOKEN:-}
      EXAM_MAX_TIMEOUT_MS: ${EXAM_MAX_TIMEOUT_MS:-15000}
      EXAM_WORKERS:        ${EXAM_WORKERS:-8}
    # System plików tylko do odczytu; kod kursanta pisze wyłącznie do /tmp.
    # UWAGA: /tmp nie może być `noexec` — języki kompilowane (C/C++) uruchamiają
    # stamtąd program wynikowy. Zamiast tego ograniczamy rozmiar, CPU, RAM i PID-y.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${EXAM_MEM_LIMIT:-1g}
    cpus: ${EXAM_CPUS:-1.5}
    networks:
      - exam

networks:
  feer:
    driver: bridge
    name: docker_feer

  # Sieć bez trasy na zewnątrz — izoluje piaskownicę silnika egzaminów.
  exam:
    driver: bridge
    internal: true
    name: docker_feer_exam
