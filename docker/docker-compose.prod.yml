# ── PRODUKCJA — Traefik + Let's Encrypt SSL ───────────────────────────────────
#
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Wymagania:
#   - Plik .env.prod wypełniony (skopiuj z .env.prod.example)
#   - DNS: ${DOMAIN} → IP serwera
#   - Porty 80 i 443 otwarte w firewallu

services:

  # ── Traefik — reverse proxy + automatyczny SSL Let's Encrypt ─────────────
  traefik:
    image: traefik:v3
    container_name: feer-traefik
    restart: unless-stopped
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=feer_feer"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt (HTTP-01 challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Logi
      - "--log.level=WARN"
      - "--accesslog=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - feer

  # ── App — nadpisania dla produkcji ───────────────────────────────────────
  app:
    volumes:
      # Nadpisuje dev php.ini plikiem produkcyjnym
      - ./php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV: production
    labels:
      - "traefik.enable=true"

      # ── Router HTTPS ──────────────────────────────────────────────────────
      - "traefik.http.routers.feer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer.entrypoints=websecure"
      - "traefik.http.routers.feer.tls=true"
      - "traefik.http.routers.feer.tls.certresolver=le"
      - "traefik.http.routers.feer.middlewares=sec-headers@docker"
      - "traefik.http.services.feer.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.feer-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer-http.entrypoints=web"
      - "traefik.http.routers.feer-http.middlewares=https-redirect@docker"

      # ── Middleware: HTTPS redirect ────────────────────────────────────────
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # ── Middleware: nagłówki bezpieczeństwa ───────────────────────────────
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.X-Powered-By="

  # ── CRM redirect — crm.feer.org.pl → szo.feer.org.pl/crm ────────────────
  # Używa wyłącznie Traefik middlewares (bez dodatkowego kontenera).
  # Serwis "dummy" jest potrzebny tylko jako uchwyt dla labels Traefika.
  crm-redirect:
    image: traefik/whoami:latest
    container_name: feer-crm-redirect
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # ── Middleware: 301 redirect crm.* → szo.feer.org.pl/crm ─────────────
      - "traefik.http.middlewares.crm-redirect.redirectregex.regex=^https?://${DOMAIN_CRM:-crm.feer.org.pl}/(.*)"
      - "traefik.http.middlewares.crm-redirect.redirectregex.replacement=https://${DOMAIN}/crm/$${1}"
      - "traefik.http.middlewares.crm-redirect.redirectregex.permanent=true"

      # ── Router HTTPS — crm.feer.org.pl ───────────────────────────────────
      - "traefik.http.routers.crm-redirect.rule=Host(`${DOMAIN_CRM:-crm.feer.org.pl}`)"
      - "traefik.http.routers.crm-redirect.entrypoints=websecure"
      - "traefik.http.routers.crm-redirect.tls=true"
      - "traefik.http.routers.crm-redirect.tls.certresolver=le"
      - "traefik.http.routers.crm-redirect.middlewares=crm-redirect@docker"
      - "traefik.http.services.crm-redirect.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.crm-redirect-http.rule=Host(`${DOMAIN_CRM:-crm.feer.org.pl}`)"
      - "traefik.http.routers.crm-redirect-http.entrypoints=web"
      - "traefik.http.routers.crm-redirect-http.middlewares=https-redirect@docker"
    networks:
      - feer

  # ── ZADANIA redirect — zadania.feer.org.pl → szo.feer.org.pl/tasks ──────
  # Używa wyłącznie Traefik middlewares (bez dodatkowego kontenera).
  # Serwis "dummy" jest potrzebny tylko jako uchwyt dla labels Traefika.
  tasks-redirect:
    image: traefik/whoami:latest
    container_name: feer-tasks-redirect
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # ── Middleware: 301 redirect zadania.* → szo.feer.org.pl/tasks ───────
      - "traefik.http.middlewares.tasks-redirect.redirectregex.regex=^https?://${DOMAIN_TASKS:-zadania.feer.org.pl}/(.*)"
      - "traefik.http.middlewares.tasks-redirect.redirectregex.replacement=https://${DOMAIN}/tasks/$${1}"
      - "traefik.http.middlewares.tasks-redirect.redirectregex.permanent=true"

      # ── Router HTTPS — zadania.feer.org.pl ───────────────────────────────
      - "traefik.http.routers.tasks-redirect.rule=Host(`${DOMAIN_TASKS:-zadania.feer.org.pl}`)"
      - "traefik.http.routers.tasks-redirect.entrypoints=websecure"
      - "traefik.http.routers.tasks-redirect.tls=true"
      - "traefik.http.routers.tasks-redirect.tls.certresolver=le"
      - "traefik.http.routers.tasks-redirect.middlewares=tasks-redirect@docker"
      - "traefik.http.services.tasks-redirect.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.tasks-redirect-http.rule=Host(`${DOMAIN_TASKS:-zadania.feer.org.pl}`)"
      - "traefik.http.routers.tasks-redirect-http.entrypoints=web"
      - "traefik.http.routers.tasks-redirect-http.middlewares=https-redirect@docker"
    networks:
      - feer

  # ── TI redirect — ti.feer.org.pl → szo.feer.org.pl/karty30/ti/kursant/ ──
  # Panel kursanta TI. Używa wyłącznie Traefik middlewares (bez dodatkowego
  # kontenera); serwis "dummy" jest potrzebny tylko jako uchwyt dla labels.
  ti-redirect:
    image: traefik/whoami:latest
    container_name: feer-ti-redirect
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # ── Middleware: 301 redirect ti.* → szo.feer.org.pl/karty30/ti/kursant/ ─
      - "traefik.http.middlewares.ti-redirect.redirectregex.regex=^https?://${DOMAIN_TI:-ti.feer.org.pl}/(.*)"
      - "traefik.http.middlewares.ti-redirect.redirectregex.replacement=https://${DOMAIN}/karty30/ti/kursant/$${1}"
      - "traefik.http.middlewares.ti-redirect.redirectregex.permanent=true"

      # ── Router HTTPS — ti.feer.org.pl ────────────────────────────────────
      - "traefik.http.routers.ti-redirect.rule=Host(`${DOMAIN_TI:-ti.feer.org.pl}`)"
      - "traefik.http.routers.ti-redirect.entrypoints=websecure"
      - "traefik.http.routers.ti-redirect.tls=true"
      - "traefik.http.routers.ti-redirect.tls.certresolver=le"
      - "traefik.http.routers.ti-redirect.middlewares=ti-redirect@docker"
      - "traefik.http.services.ti-redirect.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.ti-redirect-http.rule=Host(`${DOMAIN_TI:-ti.feer.org.pl}`)"
      - "traefik.http.routers.ti-redirect-http.entrypoints=web"
      - "traefik.http.routers.ti-redirect-http.middlewares=https-redirect@docker"
    networks:
      - feer

volumes:
  letsencrypt_data:
