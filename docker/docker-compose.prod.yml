# ── PRODUKCJA — Traefik + Let's Encrypt SSL ───────────────────────────────────
#
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Wymagania:
#   - Plik .env.prod wypełniony (skopiuj z .env.prod.example)
#   - DNS: ${DOMAIN} → IP serwera
#   - Porty 80 i 443 otwarte w firewallu

services:

  # ── Traefik — reverse proxy + automatyczny SSL Let's Encrypt ─────────────
  traefik:
    image: traefik:v3
    container_name: feer-traefik
    restart: unless-stopped
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=feer_feer"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt (HTTP-01 challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Logi
      - "--log.level=WARN"
      - "--accesslog=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - feer

  # ── App — nadpisania dla produkcji ───────────────────────────────────────
  app:
    volumes:
      # Nadpisuje dev php.ini plikiem produkcyjnym
      - ./php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV: production
    labels:
      - "traefik.enable=true"

      # ── Router HTTPS ──────────────────────────────────────────────────────
      - "traefik.http.routers.feer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer.entrypoints=websecure"
      - "traefik.http.routers.feer.tls=true"
      - "traefik.http.routers.feer.tls.certresolver=le"
      - "traefik.http.routers.feer.middlewares=sec-headers@docker"
      - "traefik.http.services.feer.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.feer-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer-http.entrypoints=web"
      - "traefik.http.routers.feer-http.middlewares=https-redirect@docker"

      # ── Middleware: HTTPS redirect ────────────────────────────────────────
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # ── Middleware: nagłówki bezpieczeństwa ───────────────────────────────
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.X-Powered-By="

      # ══════════════════════════════════════════════════════════════════════
      #  ALIASY ngosystem.pl — transparentne (bez 301), routing wprost do app.
      #  Każdy alias dokleja prefiks ścieżki, więc np.
      #    crm.ngosystem.pl/<x>  →  app obsługuje  /crm/<x>
      #  Adres w pasku przeglądarki POZOSTAJE na *.ngosystem.pl.
      #  Uwaga: aplikacja używa stałego APP_URL (szo.feer.org.pl) — zob. DEPLOY.md
      #  „Aliasy ngosystem.pl" w sprawie świadomości hosta przy logowaniu/linkach.
      # ══════════════════════════════════════════════════════════════════════

      # ── Alias CRM — crm.ngosystem.pl (prefix /crm) ───────────────────────
      - "traefik.http.middlewares.crm-prefix.addprefix.prefix=/crm"
      - "traefik.http.routers.crm-alias.rule=Host(`${DOMAIN_CRM:-crm.ngosystem.pl}`)"
      - "traefik.http.routers.crm-alias.entrypoints=websecure"
      - "traefik.http.routers.crm-alias.tls=true"
      - "traefik.http.routers.crm-alias.tls.certresolver=le"
      - "traefik.http.routers.crm-alias.service=feer"
      - "traefik.http.routers.crm-alias.middlewares=crm-prefix@docker,sec-headers@docker"
      - "traefik.http.routers.crm-alias-http.rule=Host(`${DOMAIN_CRM:-crm.ngosystem.pl}`)"
      - "traefik.http.routers.crm-alias-http.entrypoints=web"
      - "traefik.http.routers.crm-alias-http.middlewares=https-redirect@docker"

      # ── Alias ZADANIA — zadania.ngosystem.pl (prefix /tasks) ─────────────
      - "traefik.http.middlewares.tasks-prefix.addprefix.prefix=/tasks"
      - "traefik.http.routers.tasks-alias.rule=Host(`${DOMAIN_TASKS:-zadania.ngosystem.pl}`)"
      - "traefik.http.routers.tasks-alias.entrypoints=websecure"
      - "traefik.http.routers.tasks-alias.tls=true"
      - "traefik.http.routers.tasks-alias.tls.certresolver=le"
      - "traefik.http.routers.tasks-alias.service=feer"
      - "traefik.http.routers.tasks-alias.middlewares=tasks-prefix@docker,sec-headers@docker"
      - "traefik.http.routers.tasks-alias-http.rule=Host(`${DOMAIN_TASKS:-zadania.ngosystem.pl}`)"
      - "traefik.http.routers.tasks-alias-http.entrypoints=web"
      - "traefik.http.routers.tasks-alias-http.middlewares=https-redirect@docker"

      # ── Alias TI — ti.ngosystem.pl (prefix /karty30/ti/kursant) ──────────
      - "traefik.http.middlewares.ti-prefix.addprefix.prefix=/karty30/ti/kursant"
      - "traefik.http.routers.ti-alias.rule=Host(`${DOMAIN_TI:-ti.ngosystem.pl}`)"
      - "traefik.http.routers.ti-alias.entrypoints=websecure"
      - "traefik.http.routers.ti-alias.tls=true"
      - "traefik.http.routers.ti-alias.tls.certresolver=le"
      - "traefik.http.routers.ti-alias.service=feer"
      - "traefik.http.routers.ti-alias.middlewares=ti-prefix@docker,sec-headers@docker"
      - "traefik.http.routers.ti-alias-http.rule=Host(`${DOMAIN_TI:-ti.ngosystem.pl}`)"
      - "traefik.http.routers.ti-alias-http.entrypoints=web"
      - "traefik.http.routers.ti-alias-http.middlewares=https-redirect@docker"

volumes:
  letsencrypt_data:
