# ── PRODUKCJA — Traefik + Let's Encrypt SSL ───────────────────────────────────
#
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Wymagania:
#   - Plik .env.prod wypełniony (skopiuj z .env.prod.example)
#   - DNS: wszystkie domeny feer.org.pl → IP serwera
#   - Porty 80 i 443 otwarte w firewallu
#
# Domeny ze SSL (certresolver=le):
#   szo.feer.org.pl, crm.feer.org.pl, ezd.feer.org.pl, zadania.feer.org.pl
#   crm.ngosystem.pl
#
# Domeny bez certresolver (Cloudflare proxy lub brak DNS):
#   ngosystem.pl, www.ngosystem.pl, szo/ezd/zadania.ngosystem.pl → redirect 301

services:

  # ── Traefik — reverse proxy + automatyczny SSL Let's Encrypt ─────────────
  traefik:
    image: traefik:v3
    container_name: feer-traefik
    restart: unless-stopped
    dns:
      - 8.8.8.8   # fallback gdy systemd-resolved na hoście nie działa
      - 1.1.1.1
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=docker_feer"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Dodatkowy entrypoint dla EJBCA AdminWeb (TLS passthrough, zob. docker-compose.ejbca.yml)
      - "--entrypoints.ejbca-admin.address=:8443"
      # Let's Encrypt (HTTP-01 challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Logi
      - "--log.level=WARN"
      - "--accesslog=false"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"   # EJBCA AdminWeb (TLS passthrough) — nieaktywny bez docker-compose.ejbca.yml
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - feer

  # ── App — nadpisania dla produkcji ───────────────────────────────────────
  app:
    volumes:
      # Nadpisuje dev php.ini plikiem produkcyjnym
      - ./php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV: production
    labels:
      - "traefik.enable=true"

      # ══════════════════════════════════════════════════════════════════════
      #  feer.org.pl — domeny kanoniczne ze SSL
      # ══════════════════════════════════════════════════════════════════════

      # ── szo.feer.org.pl — główny panel ───────────────────────────────────
      - "traefik.http.routers.feer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer.entrypoints=websecure"
      - "traefik.http.routers.feer.tls=true"
      - "traefik.http.routers.feer.tls.certresolver=le"
      - "traefik.http.routers.feer.middlewares=sec-headers@docker,error-pages@docker"
      - "traefik.http.services.feer.loadbalancer.server.port=80"
      - "traefik.http.routers.feer-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer-http.entrypoints=web"
      - "traefik.http.routers.feer-http.middlewares=https-redirect@docker"

      # ── Middleware: HTTPS redirect ────────────────────────────────────────
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # ── Middleware: nagłówki bezpieczeństwa ───────────────────────────────
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.X-Powered-By="

      # ── Middleware: przyjazna strona błędu 5xx (Bad Gateway itp.) ────────────
      - "traefik.http.middlewares.error-pages.errors.status=500,502-504"
      - "traefik.http.middlewares.error-pages.errors.service=error-pages@docker"
      - "traefik.http.middlewares.error-pages.errors.query=/error.html"

      # ── crm.feer.org.pl ───────────────────────────────────────────────────
      - "traefik.http.routers.feer-crm.rule=Host(`crm.feer.org.pl`)"
      - "traefik.http.routers.feer-crm.entrypoints=websecure"
      - "traefik.http.routers.feer-crm.tls=true"
      - "traefik.http.routers.feer-crm.tls.certresolver=le"
      - "traefik.http.routers.feer-crm.middlewares=sec-headers@docker,error-pages@docker"
      - "traefik.http.routers.feer-crm.service=feer"
      - "traefik.http.routers.feer-crm-http.rule=Host(`crm.feer.org.pl`)"
      - "traefik.http.routers.feer-crm-http.entrypoints=web"
      - "traefik.http.routers.feer-crm-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.feer-crm-http.service=feer"

      # ── Middleware: prefix /ezd dla ezd.feer.org.pl ───────────────────────
      - "traefik.http.middlewares.ezd-prefix.addprefix.prefix=/ezd"

      # ── ezd.feer.org.pl → /ezd ────────────────────────────────────────────
      - "traefik.http.routers.feer-ezd.rule=Host(`ezd.feer.org.pl`)"
      - "traefik.http.routers.feer-ezd.entrypoints=websecure"
      - "traefik.http.routers.feer-ezd.tls=true"
      - "traefik.http.routers.feer-ezd.tls.certresolver=le"
      - "traefik.http.routers.feer-ezd.middlewares=sec-headers@docker,ezd-prefix@docker,error-pages@docker"
      - "traefik.http.routers.feer-ezd.service=feer"
      - "traefik.http.routers.feer-ezd-http.rule=Host(`ezd.feer.org.pl`)"
      - "traefik.http.routers.feer-ezd-http.entrypoints=web"
      - "traefik.http.routers.feer-ezd-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.feer-ezd-http.service=feer"

      # ── ti.feer.org.pl ────────────────────────────────────────────────────
      - "traefik.http.routers.feer-ti.rule=Host(`ti.feer.org.pl`)"
      - "traefik.http.routers.feer-ti.entrypoints=websecure"
      - "traefik.http.routers.feer-ti.tls=true"
      - "traefik.http.routers.feer-ti.tls.certresolver=le"
      - "traefik.http.routers.feer-ti.middlewares=sec-headers@docker,error-pages@docker"
      - "traefik.http.routers.feer-ti.service=feer"
      - "traefik.http.routers.feer-ti-http.rule=Host(`ti.feer.org.pl`)"
      - "traefik.http.routers.feer-ti-http.entrypoints=web"
      - "traefik.http.routers.feer-ti-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.feer-ti-http.service=feer"

      # ── kursant.feer.org.pl → ti.feer.org.pl (301) ──────────────────────
      - "traefik.http.middlewares.kursant-redir.redirectregex.regex=^https?://kursant\\.feer\\.org\\.pl(.*)"
      - "traefik.http.middlewares.kursant-redir.redirectregex.replacement=https://ti.feer.org.pl$${1}"
      - "traefik.http.middlewares.kursant-redir.redirectregex.permanent=true"
      - "traefik.http.routers.feer-kursant.rule=Host(`kursant.feer.org.pl`)"
      - "traefik.http.routers.feer-kursant.entrypoints=websecure"
      - "traefik.http.routers.feer-kursant.tls=true"
      - "traefik.http.routers.feer-kursant.tls.certresolver=le"
      - "traefik.http.routers.feer-kursant.middlewares=kursant-redir@docker"
      - "traefik.http.routers.feer-kursant.service=feer"
      - "traefik.http.routers.feer-kursant-http.rule=Host(`kursant.feer.org.pl`)"
      - "traefik.http.routers.feer-kursant-http.entrypoints=web"
      - "traefik.http.routers.feer-kursant-http.middlewares=kursant-redir@docker"
      - "traefik.http.routers.feer-kursant-http.service=feer"

      # ── zadania.feer.org.pl ───────────────────────────────────────────────
      - "traefik.http.routers.feer-zadania.rule=Host(`zadania.feer.org.pl`)"
      - "traefik.http.routers.feer-zadania.entrypoints=websecure"
      - "traefik.http.routers.feer-zadania.tls=true"
      - "traefik.http.routers.feer-zadania.tls.certresolver=le"
      - "traefik.http.routers.feer-zadania.middlewares=sec-headers@docker,error-pages@docker"
      - "traefik.http.routers.feer-zadania.service=feer"
      - "traefik.http.routers.feer-zadania-http.rule=Host(`zadania.feer.org.pl`)"
      - "traefik.http.routers.feer-zadania-http.entrypoints=web"
      - "traefik.http.routers.feer-zadania-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.feer-zadania-http.service=feer"

      # ══════════════════════════════════════════════════════════════════════
      #  ngosystem.pl → feer.org.pl — przekierowania 301
      #
      #  Domeny przez Cloudflare proxy: bez certresolver (HTTP-01 nie przechodzi).
      #  crm.ngosystem.pl: z certresolver (bezpośredni DNS, bez proxy).
      # ══════════════════════════════════════════════════════════════════════

      # ── crm.ngosystem.pl → crm.feer.org.pl ───────────────────────────────
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.regex=^https?://crm\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.replacement=https://crm.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-crm.rule=Host(`crm.ngosystem.pl`)"
      - "traefik.http.routers.ngo-crm.entrypoints=websecure"
      - "traefik.http.routers.ngo-crm.tls=true"
      - "traefik.http.routers.ngo-crm.tls.certresolver=le"
      - "traefik.http.routers.ngo-crm.service=feer"
      - "traefik.http.routers.ngo-crm.middlewares=ngo-crm-redir@docker"
      - "traefik.http.routers.ngo-crm-http.rule=Host(`crm.ngosystem.pl`)"
      - "traefik.http.routers.ngo-crm-http.entrypoints=web"
      - "traefik.http.routers.ngo-crm-http.service=feer"
      - "traefik.http.routers.ngo-crm-http.middlewares=ngo-crm-redir@docker"

      # ── ti.ngosystem.pl → ti.feer.org.pl (Cloudflare — bez certresolver) ──
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.regex=^https?://ti\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.replacement=https://ti.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-ti.rule=Host(`ti.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ti.entrypoints=websecure"
      - "traefik.http.routers.ngo-ti.tls=true"
      - "traefik.http.routers.ngo-ti.service=feer"
      - "traefik.http.routers.ngo-ti.middlewares=ngo-ti-redir@docker"
      - "traefik.http.routers.ngo-ti-http.rule=Host(`ti.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ti-http.entrypoints=web"
      - "traefik.http.routers.ngo-ti-http.service=feer"
      - "traefik.http.routers.ngo-ti-http.middlewares=ngo-ti-redir@docker"

      # ── ezd.ngosystem.pl → ezd.feer.org.pl (Cloudflare — bez certresolver)
      - "traefik.http.middlewares.ngo-ezd-redir.redirectregex.regex=^https?://ezd\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-ezd-redir.redirectregex.replacement=https://ezd.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-ezd-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-ezd.rule=Host(`ezd.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ezd.entrypoints=websecure"
      - "traefik.http.routers.ngo-ezd.tls=true"
      - "traefik.http.routers.ngo-ezd.service=feer"
      - "traefik.http.routers.ngo-ezd.middlewares=ngo-ezd-redir@docker"
      - "traefik.http.routers.ngo-ezd-http.rule=Host(`ezd.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ezd-http.entrypoints=web"
      - "traefik.http.routers.ngo-ezd-http.service=feer"
      - "traefik.http.routers.ngo-ezd-http.middlewares=ngo-ezd-redir@docker"

      # ── zadania.ngosystem.pl → zadania.feer.org.pl (Cloudflare — bez certresolver)
      - "traefik.http.middlewares.ngo-zadania-redir.redirectregex.regex=^https?://zadania\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-zadania-redir.redirectregex.replacement=https://zadania.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-zadania-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-zadania.rule=Host(`zadania.ngosystem.pl`)"
      - "traefik.http.routers.ngo-zadania.entrypoints=websecure"
      - "traefik.http.routers.ngo-zadania.tls=true"
      - "traefik.http.routers.ngo-zadania.service=feer"
      - "traefik.http.routers.ngo-zadania.middlewares=ngo-zadania-redir@docker"
      - "traefik.http.routers.ngo-zadania-http.rule=Host(`zadania.ngosystem.pl`)"
      - "traefik.http.routers.ngo-zadania-http.entrypoints=web"
      - "traefik.http.routers.ngo-zadania-http.service=feer"
      - "traefik.http.routers.ngo-zadania-http.middlewares=ngo-zadania-redir@docker"

      # ── ngosystem.pl / www / szo → szo.feer.org.pl (Cloudflare — bez certresolver)
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.regex=^https?://(www\\.|szo\\.)?ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.replacement=https://szo.feer.org.pl"
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-apex.rule=Host(`ngosystem.pl`) || Host(`www.ngosystem.pl`) || Host(`szo.ngosystem.pl`)"
      - "traefik.http.routers.ngo-apex.entrypoints=websecure"
      - "traefik.http.routers.ngo-apex.tls=true"
      - "traefik.http.routers.ngo-apex.service=feer"
      - "traefik.http.routers.ngo-apex.middlewares=ngo-apex-redir@docker"
      - "traefik.http.routers.ngo-apex-http.rule=Host(`ngosystem.pl`) || Host(`www.ngosystem.pl`) || Host(`szo.ngosystem.pl`)"
      - "traefik.http.routers.ngo-apex-http.entrypoints=web"
      - "traefik.http.routers.ngo-apex-http.service=feer"
      - "traefik.http.routers.ngo-apex-http.middlewares=ngo-apex-redir@docker"

      # ── Catch-all: pozostałe *.ngosystem.pl → szo.feer.org.pl ───────────
      # Niższy priorytet niż reguły Host() powyżej.
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.regex=^https?://[^/]*\\.ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.replacement=https://szo.feer.org.pl"
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-wildcard-http.rule=HostRegexp(`^[a-z0-9-]+\\.ngosystem\\.pl$`)"
      - "traefik.http.routers.ngo-wildcard-http.entrypoints=web"
      - "traefik.http.routers.ngo-wildcard-http.priority=1"
      - "traefik.http.routers.ngo-wildcard-http.service=feer"
      - "traefik.http.routers.ngo-wildcard-http.middlewares=ngo-wildcard-redir@docker"

  # ── SZO Planner — prod Traefik labels ────────────────────────────────────
  szo-planner:
    labels:
      - "traefik.enable=true"

      # ── szo-planner.feer.org.pl — HTTPS ze SSL Let's Encrypt ─────────────
      - "traefik.http.routers.planner.rule=Host(`szo-planner.feer.org.pl`)"
      - "traefik.http.routers.planner.entrypoints=websecure"
      - "traefik.http.routers.planner.tls=true"
      - "traefik.http.routers.planner.tls.certresolver=le"
      - "traefik.http.routers.planner.middlewares=sec-headers@docker"
      - "traefik.http.services.planner.loadbalancer.server.port=80"

      # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
      - "traefik.http.routers.planner-http.rule=Host(`szo-planner.feer.org.pl`)"
      - "traefik.http.routers.planner-http.entrypoints=web"
      - "traefik.http.routers.planner-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.planner-http.service=planner"

  # ── Strona błędu — rejestracja w Traefik ────────────────────────────────
  error-pages:
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.error-pages.loadbalancer.server.port=80"

volumes:
  letsencrypt_data:
