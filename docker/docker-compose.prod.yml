# ── PRODUKCJA — Traefik + Let's Encrypt SSL ───────────────────────────────────
#
# Użycie:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Wymagania:
#   - Plik .env.prod wypełniony (skopiuj z .env.prod.example)
#   - DNS: ${DOMAIN} → IP serwera
#   - Porty 80 i 443 otwarte w firewallu

services:

  # ── Traefik — reverse proxy + automatyczny SSL Let's Encrypt ─────────────
  traefik:
    image: traefik:v3
    container_name: feer-traefik
    restart: unless-stopped
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=feer_feer"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt (HTTP-01 challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      # Logi
      - "--log.level=WARN"
      - "--accesslog=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - feer

  # ── App — nadpisania dla produkcji ───────────────────────────────────────
  app:
    volumes:
      # Nadpisuje dev php.ini plikiem produkcyjnym
      - ./php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV: production
    labels:
      - "traefik.enable=true"

      # ── Router HTTPS ──────────────────────────────────────────────────────
      - "traefik.http.routers.feer.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer.entrypoints=websecure"
      - "traefik.http.routers.feer.tls=true"
      - "traefik.http.routers.feer.tls.certresolver=le"
      - "traefik.http.routers.feer.middlewares=sec-headers@docker"
      - "traefik.http.services.feer.loadbalancer.server.port=80"

      # ── Router HTTP → redirect HTTPS ──────────────────────────────────────
      - "traefik.http.routers.feer-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.feer-http.entrypoints=web"
      - "traefik.http.routers.feer-http.middlewares=https-redirect@docker"

      # ── Middleware: HTTPS redirect ────────────────────────────────────────
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # ── Middleware: nagłówki bezpieczeństwa ───────────────────────────────
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.X-Powered-By="

      # ══════════════════════════════════════════════════════════════════════
      #  PRZEKIEROWANIA ngosystem.pl → feer.org.pl (301 Permanent)
      #
      #  Każda subdomena ngosystem.pl dostaje router HTTP + HTTPS.
      #  HTTP-01 ACME wystawia certyfikaty dla wymienionych subdomen.
      #  Catch-all (HostRegexp) przechwytuje pozostałe subdomeny na HTTP.
      # ══════════════════════════════════════════════════════════════════════

      # ── crm.ngosystem.pl → crm.feer.org.pl (ścieżka zachowana) ──────────
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.regex=^https?://crm\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.replacement=https://crm.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-crm-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-crm.rule=Host(`crm.ngosystem.pl`)"
      - "traefik.http.routers.ngo-crm.entrypoints=websecure"
      - "traefik.http.routers.ngo-crm.tls=true"
      - "traefik.http.routers.ngo-crm.tls.certresolver=le"
      - "traefik.http.routers.ngo-crm.service=feer"
      - "traefik.http.routers.ngo-crm.middlewares=ngo-crm-redir@docker"
      - "traefik.http.routers.ngo-crm-http.rule=Host(`crm.ngosystem.pl`)"
      - "traefik.http.routers.ngo-crm-http.entrypoints=web"
      - "traefik.http.routers.ngo-crm-http.service=feer"
      - "traefik.http.routers.ngo-crm-http.middlewares=ngo-crm-redir@docker"

      # ── ti.ngosystem.pl → ti.feer.org.pl (ścieżka zachowana) ────────────
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.regex=^https?://ti\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.replacement=https://ti.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-ti-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-ti.rule=Host(`ti.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ti.entrypoints=websecure"
      - "traefik.http.routers.ngo-ti.tls=true"
      - "traefik.http.routers.ngo-ti.tls.certresolver=le"
      - "traefik.http.routers.ngo-ti.service=feer"
      - "traefik.http.routers.ngo-ti.middlewares=ngo-ti-redir@docker"
      - "traefik.http.routers.ngo-ti-http.rule=Host(`ti.ngosystem.pl`)"
      - "traefik.http.routers.ngo-ti-http.entrypoints=web"
      - "traefik.http.routers.ngo-ti-http.service=feer"
      - "traefik.http.routers.ngo-ti-http.middlewares=ngo-ti-redir@docker"

      # ── kurs.ngosystem.pl → szo.feer.org.pl (panel kursanta, bez ścieżki)
      - "traefik.http.middlewares.ngo-kurs-redir.redirectregex.regex=^https?://kurs\\.ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-kurs-redir.redirectregex.replacement=https://szo.feer.org.pl"
      - "traefik.http.middlewares.ngo-kurs-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-kurs.rule=Host(`kurs.ngosystem.pl`)"
      - "traefik.http.routers.ngo-kurs.entrypoints=websecure"
      - "traefik.http.routers.ngo-kurs.tls=true"
      - "traefik.http.routers.ngo-kurs.tls.certresolver=le"
      - "traefik.http.routers.ngo-kurs.service=feer"
      - "traefik.http.routers.ngo-kurs.middlewares=ngo-kurs-redir@docker"
      - "traefik.http.routers.ngo-kurs-http.rule=Host(`kurs.ngosystem.pl`)"
      - "traefik.http.routers.ngo-kurs-http.entrypoints=web"
      - "traefik.http.routers.ngo-kurs-http.service=feer"
      - "traefik.http.routers.ngo-kurs-http.middlewares=ngo-kurs-redir@docker"

      # ── zadania.ngosystem.pl → szo.feer.org.pl/tasks ─────────────────────
      - "traefik.http.middlewares.ngo-tasks-redir.redirectregex.regex=^https?://zadania\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-tasks-redir.redirectregex.replacement=https://szo.feer.org.pl/tasks$${1}"
      - "traefik.http.middlewares.ngo-tasks-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-tasks.rule=Host(`zadania.ngosystem.pl`)"
      - "traefik.http.routers.ngo-tasks.entrypoints=websecure"
      - "traefik.http.routers.ngo-tasks.tls=true"
      - "traefik.http.routers.ngo-tasks.tls.certresolver=le"
      - "traefik.http.routers.ngo-tasks.service=feer"
      - "traefik.http.routers.ngo-tasks.middlewares=ngo-tasks-redir@docker"
      - "traefik.http.routers.ngo-tasks-http.rule=Host(`zadania.ngosystem.pl`)"
      - "traefik.http.routers.ngo-tasks-http.entrypoints=web"
      - "traefik.http.routers.ngo-tasks-http.service=feer"
      - "traefik.http.routers.ngo-tasks-http.middlewares=ngo-tasks-redir@docker"

      # ── strukturaorg.ngosystem.pl → strukturaorg.feer.org.pl ─────────────
      - "traefik.http.middlewares.ngo-struktura-redir.redirectregex.regex=^https?://strukturaorg\\.ngosystem\\.pl(.*)"
      - "traefik.http.middlewares.ngo-struktura-redir.redirectregex.replacement=https://strukturaorg.feer.org.pl$${1}"
      - "traefik.http.middlewares.ngo-struktura-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-struktura.rule=Host(`strukturaorg.ngosystem.pl`)"
      - "traefik.http.routers.ngo-struktura.entrypoints=websecure"
      - "traefik.http.routers.ngo-struktura.tls=true"
      - "traefik.http.routers.ngo-struktura.tls.certresolver=le"
      - "traefik.http.routers.ngo-struktura.service=feer"
      - "traefik.http.routers.ngo-struktura.middlewares=ngo-struktura-redir@docker"
      - "traefik.http.routers.ngo-struktura-http.rule=Host(`strukturaorg.ngosystem.pl`)"
      - "traefik.http.routers.ngo-struktura-http.entrypoints=web"
      - "traefik.http.routers.ngo-struktura-http.service=feer"
      - "traefik.http.routers.ngo-struktura-http.middlewares=ngo-struktura-redir@docker"

      # ── szo-logowanie365.ngosystem.pl → szo-logowanie365.feer.org.pl ─────
      - "traefik.http.middlewares.ngo-logowanie-redir.redirectregex.regex=^https?://szo-logowanie365\\.ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-logowanie-redir.redirectregex.replacement=https://szo-logowanie365.feer.org.pl"
      - "traefik.http.middlewares.ngo-logowanie-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-logowanie.rule=Host(`szo-logowanie365.ngosystem.pl`)"
      - "traefik.http.routers.ngo-logowanie.entrypoints=websecure"
      - "traefik.http.routers.ngo-logowanie.tls=true"
      - "traefik.http.routers.ngo-logowanie.tls.certresolver=le"
      - "traefik.http.routers.ngo-logowanie.service=feer"
      - "traefik.http.routers.ngo-logowanie.middlewares=ngo-logowanie-redir@docker"
      - "traefik.http.routers.ngo-logowanie-http.rule=Host(`szo-logowanie365.ngosystem.pl`)"
      - "traefik.http.routers.ngo-logowanie-http.entrypoints=web"
      - "traefik.http.routers.ngo-logowanie-http.service=feer"
      - "traefik.http.routers.ngo-logowanie-http.middlewares=ngo-logowanie-redir@docker"

      # ── ngosystem.pl / www / szo → szo.feer.org.pl ───────────────────────
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.regex=^https?://(www\\.|szo\\.)?ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.replacement=https://szo.feer.org.pl"
      - "traefik.http.middlewares.ngo-apex-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-apex.rule=Host(`ngosystem.pl`) || Host(`www.ngosystem.pl`) || Host(`szo.ngosystem.pl`)"
      - "traefik.http.routers.ngo-apex.entrypoints=websecure"
      - "traefik.http.routers.ngo-apex.tls=true"
      - "traefik.http.routers.ngo-apex.tls.certresolver=le"
      - "traefik.http.routers.ngo-apex.service=feer"
      - "traefik.http.routers.ngo-apex.middlewares=ngo-apex-redir@docker"
      - "traefik.http.routers.ngo-apex-http.rule=Host(`ngosystem.pl`) || Host(`www.ngosystem.pl`) || Host(`szo.ngosystem.pl`)"
      - "traefik.http.routers.ngo-apex-http.entrypoints=web"
      - "traefik.http.routers.ngo-apex-http.service=feer"
      - "traefik.http.routers.ngo-apex-http.middlewares=ngo-apex-redir@docker"

      # ── Catch-all: pozostałe *.ngosystem.pl → szo.feer.org.pl ───────────
      # Niższy priorytet niż reguły Host() powyżej (Traefik v3: krótszy rule = niższy prio).
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.regex=^https?://[^/]*\\.ngosystem\\.pl.*"
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.replacement=https://szo.feer.org.pl"
      - "traefik.http.middlewares.ngo-wildcard-redir.redirectregex.permanent=true"
      - "traefik.http.routers.ngo-wildcard-http.rule=HostRegexp(`^[a-z0-9-]+\\.ngosystem\\.pl$`)"
      - "traefik.http.routers.ngo-wildcard-http.entrypoints=web"
      - "traefik.http.routers.ngo-wildcard-http.priority=1"
      - "traefik.http.routers.ngo-wildcard-http.service=feer"
      - "traefik.http.routers.ngo-wildcard-http.middlewares=ngo-wildcard-redir@docker"

volumes:
  letsencrypt_data:
