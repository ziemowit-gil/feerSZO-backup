# ── Subdomeny modułów *.szo.feer.org.pl ─────────────────────────────────────
#
# Override do docker-compose.prod.yml — dodaje routery Traefik dla wszystkich
# modułów systemu dostępnych przez subdomenę szo.feer.org.pl.
#
# Użycie:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.szo-subdomains.yml \
#     --env-file .env.prod \
#     up -d
#
# Wymagania:
#   - Wildcard DNS: *.szo.feer.org.pl → IP serwera (szara chmurka Cloudflare)
#   - Porty 80/443 dostępne bezpośrednio (HTTP-01 challenge)
#   - certresolver 'le' skonfigurowany w docker-compose.prod.yml
#
# Każdy moduł: routing przez .htaccess (no addprefix middleware).
# SSL: Let's Encrypt HTTP-01 per subdomena.
#
# ngosystem.pl: zaktualizowany catch-all który zachowuje nazwę subdomeny
#   → panel.ngosystem.pl przekierowuje do panel.szo.feer.org.pl

services:
  app:
    labels:

      # ════════════════════════════════════════════════════════════════════════
      #  *.szo.feer.org.pl — subdomeny modułów z SSL Let's Encrypt
