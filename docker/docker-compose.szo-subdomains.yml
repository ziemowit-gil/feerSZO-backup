      - "traefik.http.routers.szo-crm.entrypoints=websecure"
      - "traefik.http.routers.szo-crm.tls=true"
      - "traefik.http.routers.szo-crm.tls.certresolver=le"
      - "traefik.http.routers.szo-crm.middlewares=sec-headers@docker,error-pages@docker"
      - "traefik.http.routers.szo-crm.service=feer"
      - "traefik.http.routers.szo-crm-http.rule=Host(`crm.szo.feer.org.pl`)"
      - "traefik.http.routers.szo-crm-http.entrypoints=web"
      - "traefik.http.routers.szo-crm-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.szo-crm-http.service=feer"

